# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the run it interrupts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          # Kept in step with .zigversion and build.zig.zon's
          # minimum_zig_version, the same way flake.nix is.
          version: 0.16.0

      - name: tests and SPDX headers
        run: zig build check --summary all

      # The phase 1 go/no-go gate. It exits non-zero below the hit rate, which
      # is what makes it a gate rather than a report.
      - name: anchor harness
        run: zig build anchor

      # The steps above run in Debug, where `std.debug.assert` is live. It is
      # compiled out in ReleaseFast, which is why bridge.zig refuses a newline
      # with a returned error rather than an assert, so the suite is run again
      # in the mode that ships. Around 13s.
      - name: release build and tests
        run: |
          zig build -Doptimize=ReleaseFast
          zig build test -Doptimize=ReleaseFast
