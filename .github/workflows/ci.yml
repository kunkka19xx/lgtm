# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the run it interrupts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The download budget, also checked per target in release.yml.
env:
  MAX_BINARY_BYTES: 6291456

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          # Kept in step with .zigversion and build.zig.zon's
          # minimum_zig_version, the same way flake.nix is.
          version: 0.16.0

      - name: tests
        run: zig build test --summary all

      # Everything from here down is independent of the steps above, so each
      # runs even after one has failed. A step's default `success()` would stop
      # at the first red and hide the rest, which turns one run into three.
      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: zig build spdx

      # The phase 1 go/no-go gate. It exits non-zero below the hit rate, which
      # is what makes it a gate rather than a report.
      - name: anchor harness
        if: ${{ !cancelled() }}
        run: zig build anchor

      # The steps above run in Debug, where `std.debug.assert` is live. It is
      # compiled out in ReleaseFast, which is why bridge.zig refuses a newline
      # with a returned error rather than an assert, so the suite is run again
      # in the mode that ships. Around 13s.
      - name: release build and tests
        if: ${{ !cancelled() }}
        run: |
          zig build -Doptimize=ReleaseFast
          zig build test -Doptimize=ReleaseFast

      # The budget is about what a user downloads, so it is checked against the
      # binary a user would download.
      - name: distribution binary fits its budget
        if: ${{ !cancelled() }}
        run: |
          zig build dist
          size=$(stat -c%s zig-out/bin/lgtm 2>/dev/null || stat -f%z zig-out/bin/lgtm)
          echo "stripped ReleaseSmall: $size bytes ($((size * 100 / MAX_BINARY_BYTES))% of budget)"
          test "$size" -lt "$MAX_BINARY_BYTES"

  # The AUR rejects a push whose .SRCINFO disagrees with its PKGBUILD, and that
  # rejection arrives at release time, on a machine most of us do not have. It
  # is a pure function of the PKGBUILD, so regenerating it and diffing is the
  # whole check. The runner is x86_64, so the official image is native here and
  # none of the emulation trouble from a local arm64 run applies.
  packaging:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # pacman's own sandbox needs seccomp permissions the container does not
      # have, and without this every database sync fails.
      - name: pacman
        run: pacman -Sy --noconfirm --disable-sandbox git

      - uses: actions/checkout@v7

      - name: .SRCINFO matches its PKGBUILD
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # makepkg refuses to run as root: a PKGBUILD is arbitrary code.
          useradd -m build
          chown -R build packaging/aur
          for p in lgtm-bin lgtm-git; do
            su build -c "cd packaging/aur/$p && makepkg --printsrcinfo > .SRCINFO"
          done
          git diff --exit-code -- packaging/aur || {
            echo "::error::.SRCINFO is stale - run 'make -C packaging/aur srcinfo'"
            exit 1
          }

  # Four files repeat the pinned zig version and none can read a .zon. Here
  # rather than in the release workflow: a mismatch found at tag time is found
  # after the tag exists.
  #
  # flake.nix is not among them - it reads both versions from the files that
  # own them, so there is no literal to go stale. The `nix` job checks that by
  # evaluating it.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: one zig
        run: |
          pinned=$(cat .zigversion)
          min=$(sed -n 's/^ *\.minimum_zig_version = "\(.*\)",$/\1/p' build.zig.zon)
          ci=$(sed -n 's/^ *version: \(0\..*\)$/\1/p' .github/workflows/ci.yml | head -1)
          rel=$(sed -n 's/^ *version: \(0\..*\)$/\1/p' .github/workflows/release.yml | head -1)
          # The AUR package spells its pin as a floor, `zig>=X`. The floor is
          # still meant to be the pinned version, so it is compared as one.
          aur=$(sed -n "s/^makedepends=.*zig>=\\([0-9.]*\\).*/\\1/p" packaging/aur/lgtm-git/PKGBUILD)
          echo ".zigversion $pinned / zon $min / ci $ci / release $rel / aur $aur"
          for v in "$min" "$ci" "$rel" "$aur"; do
            test "$pinned" = "$v" || {
              echo "::error::the pinned zig version disagrees across these files"; exit 1; }
          done

  # The flake ships a package, not just a dev shell, so `nix run
  # github:kunkka19xx/lgtm` is an advertised install path and has to be one
  # that works. It cannot be checked by reading: zigDeps is a fixed-output
  # derivation whose hash is filled in by hand, and a wrong one fails only when
  # something actually builds. This is that something.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # Evaluation only, and for every system the flake claims - not just this
      # runner's. A system listed in `systems` that its own nixpkgs no longer
      # supports fails here and nowhere else: `nix build` on x86_64-linux is
      # perfectly happy while an Intel Mac gets an evaluation error.
      - name: the flake evaluates for every system it claims
        run: nix flake show --all-systems > /dev/null

      # Evaluated rather than grepped: the derivation fails by reading the
      # wrong line, which a regex over the source could not see.
      - name: the version the flake derived is the manifest's
        run: |
          zon=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          got=$(nix eval --raw .#lgtm.version)
          echo "build.zig.zon $zon / flake derived $got"
          test "$zon" = "$got" || {
            echo "::error::flake.nix derived $got, build.zig.zon says $zon"; exit 1; }

      - name: nix build
        run: nix build --print-build-logs .#lgtm

      - name: the binary it produced runs
        run: ./result/bin/lgtm --version
